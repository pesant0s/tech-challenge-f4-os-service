name: CI/CD

# Testes, manifestos e boot da imagem sempre; publicação e deploy só com AMBIENTE_ATIVO=true
# (ADR-013, no tech-challenge-f4-plataforma). A main só recebe código por Pull Request.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  SERVICO: os-service

permissions:
  contents: read

jobs:
  testes:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: "chave-de-ci-com-mais-de-32-caracteres-para-teste"
    # RabbitMQ real para o teste da thread de mensageria (ADR-019).
    services:
      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: oficina
          RABBITMQ_DEFAULT_PASS: oficina
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Abaixo de 80% de cobertura o pipeline falha.
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -q --cucumberjson=relatorio-bdd.json
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml
      # Evidência do fluxo completo da Saga em BDD (tests/bdd/saga_abertura_os.feature).
      - uses: actions/upload-artifact@v4
        with:
          name: relatorio-bdd
          path: relatorio-bdd.json

  qualidade:
    name: Qualidade (SonarQube Cloud)
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: cobertura
      # O quality gate do SonarQube Cloud reprova o pipeline (sonar.qualitygate.wait no sonar-project.properties).
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  manifestos:
    name: Validar manifestos Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renderizar e validar contra o schema
        run: |
          kubectl kustomize k8s/overlays/producao > /tmp/manifestos.yaml
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz -C /tmp
          /tmp/kubeconform -strict -summary /tmp/manifestos.yaml

  imagem:
    name: Build e prova da imagem
    needs: [testes, manifestos]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oficina
          # Com caracteres especiais, como a senha gerada em produção.
          POSTGRES_PASSWORD: "oficina!#%"
          POSTGRES_DB: oficina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oficina"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: oficina
          RABBITMQ_DEFAULT_PASS: oficina
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t os-service:ci .

      # Mesmo caminho de um deploy novo: o entrypoint migra um banco vazio e sobe o servidor.
      - name: Provar que a imagem sobe contra PostgreSQL e RabbitMQ
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://oficina:oficina%21%23%25@localhost:5432/oficina \
            -e SECRET_KEY=chave-de-ci-com-mais-de-32-caracteres-para-teste \
            -e RABBITMQ_URL=amqp://oficina:oficina@localhost:5672/%2F \
            -e LOG_FORMAT=json \
            os-service:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health/ready && docker logs api 2>&1 | grep -q mensageria_conectada; then
              exit 0
            fi
            [ "$(docker inspect -f '{{.State.Running}}' api)" = "true" ] || break
            sleep 1
          done
          docker logs api
          exit 1

  ambiente-desligado:
    name: Publicação e deploy não executados
    needs: imagem
    if: github.ref_name == 'main' && github.event_name != 'pull_request' && vars.AMBIENTE_ATIVO != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "### Publicação e deploy pulados — AMBIENTE_ATIVO não está true, o ambiente AWS está desligado." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy no EKS
    needs: [testes, qualidade, manifestos, imagem]
    if: github.ref_name == 'main' && github.event_name != 'pull_request' && vars.AMBIENTE_ATIVO == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4

      # Conta comum: OIDC. Laboratório (AWS Academy): credenciais da sessão.
      - name: Autenticar na AWS via OIDC
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Autenticar na AWS com as credenciais da sessão
        if: env.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: conta
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      # ECR e banco são idempotentes: sem mudança, o apply não altera nada.
      - name: Aplicar a infraestrutura do serviço
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=tech-challenge-f4-tfstate-${{ steps.conta.outputs.id }}" \
            -backend-config="region=$AWS_REGION"
          terraform -chdir=infra apply -auto-approve -input=false

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build e push da imagem
        id: imagem
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGEM="$REGISTRY/tech-challenge-f4-$SERVICO:${GITHUB_SHA::7}"
          docker build -t "$IMAGEM" .
          docker push "$IMAGEM"
          echo "imagem=$IMAGEM" >> "$GITHUB_OUTPUT"

      - name: Apontar o kubectl para o cluster
        run: aws eks update-kubeconfig --name "$(aws ssm get-parameter --name /tech-challenge-f4/cluster/nome --query Parameter.Value --output text)" --region "$AWS_REGION"

      - name: Criar namespace
        run: kubectl create namespace "$SERVICO" --dry-run=client -o yaml | kubectl apply -f -

      # O Secret nunca é versionado: é montado a cada deploy a partir do SSM.
      - name: Sincronizar Secret
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          ssm() { aws ssm get-parameter --name "/tech-challenge-f4/$1" --with-decryption --query Parameter.Value --output text; }

          # O admin é semeado só na primeira subida, então a senha precisa sobreviver aos deploys:
          # vale o secret do GitHub; sem ele, a que já está no cluster; sem nenhuma, uma nova.
          if [ -z "$ADMIN_PASSWORD" ]; then
            ADMIN_PASSWORD=$(kubectl get secret "$SERVICO-segredos" -n "$SERVICO" -o jsonpath='{.data.ADMIN_PASSWORD}' 2>/dev/null | base64 -d || true)
          fi
          if [ -z "$ADMIN_PASSWORD" ]; then
            ADMIN_PASSWORD=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          fi
          echo "::add-mask::$ADMIN_PASSWORD"

          NR=$(ssm newrelic/license_key)
          # Vazio ou "desligado": o agente não sobe, e a chave não entra no Secret.
          NR_ARG=()
          if [ -n "$NR" ] && [ "$NR" != "None" ] && [ "$NR" != "desligado" ]; then
            echo "::add-mask::$NR"
            NR_ARG=(--from-literal=NEW_RELIC_LICENSE_KEY="$NR")
          fi
          kubectl create secret generic "$SERVICO-segredos" --namespace "$SERVICO" \
            --from-literal=DATABASE_URL="$(ssm os-service/database_url)" \
            --from-literal=SECRET_KEY="$(ssm segredos/jwt_secret_key)" \
            --from-literal=RABBITMQ_URL="$(ssm rabbitmq/url)" \
            --from-literal=TOKEN_INTERNO="$(ssm segredos/token_interno)" \
            --from-literal=ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            "${NR_ARG[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar manifestos
        env:
          IMAGEM: ${{ steps.imagem.outputs.imagem }}
        run: |
          (cd k8s/overlays/producao && kustomize edit set image "IMAGEM_PLACEHOLDER=$IMAGEM")
          kubectl apply -k k8s/overlays/producao
          kubectl rollout status "deployment/$SERVICO" -n "$SERVICO" --timeout=300s

      - name: Teste de fumaça pelo API Gateway
        run: |
          ENDPOINT=$(aws ssm get-parameter --name /tech-challenge-f4/apigateway/endpoint --query Parameter.Value --output text)
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$ENDPOINT/health")" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::GET $ENDPOINT/health não respondeu 200."
          exit 1

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          kubectl get all -n "$SERVICO" || true
          kubectl logs -n "$SERVICO" -l app.kubernetes.io/name="$SERVICO" --tail=100 || true
