apiVersion: v1
kind: ConfigMap
metadata:
  name: os-service
data:
  ALLOWED_ORIGINS: '["*"]'
  LOG_FORMAT: "json"
  LOG_LEVEL: "INFO"
  UVICORN_WORKERS: "2"
  NEW_RELIC_APP_NAME: "tech-challenge-f4-os-service"
  # O stdout já chega pelo nri-bundle; o encaminhamento do agente duplicaria cada linha.
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "false"
