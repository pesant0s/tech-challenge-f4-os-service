apiVersion: v1
kind: Service
metadata:
  name: os-service
spec:
  # Porta fixa: o NLB da plataforma aponta para a 30080 (contrato de infraestrutura).
  type: NodePort
  selector:
    app.kubernetes.io/name: os-service
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
