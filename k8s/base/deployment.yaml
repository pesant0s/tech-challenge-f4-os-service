apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service
  labels:
    app.kubernetes.io/name: os-service
    app.kubernetes.io/part-of: tech-challenge-f4
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: os-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: os-service
        app.kubernetes.io/part-of: tech-challenge-f4
    spec:
      serviceAccountName: os-service
      automountServiceAccountToken: false
      containers:
        - name: api
          image: IMAGEM_PLACEHOLDER
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: os-service
            - secretRef:
                name: os-service-segredos
          # Cobre o alembic upgrade head do boot sem a liveness matar o pod.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            # O agente do New Relic grava o próprio log em disco, então o sistema de arquivos não pode ser só leitura.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
