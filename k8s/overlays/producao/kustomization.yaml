apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: os-service

resources:
  - ../../base

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/instance: producao

# O pipeline troca o placeholder pela imagem do commit (kustomize edit set image).
images:
  - name: IMAGEM_PLACEHOLDER
    newName: IMAGEM_PLACEHOLDER
    newTag: latest
